server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name (e.g. khatt.example.com)

    root /var/www/khatt;
    index index.html;

    charset utf-8;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Single Page App & static routing for Next.js static export
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Next.js immutable assets (hashed chunks)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # PWA Service Worker (must revalidate on every request)
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Web App Manifest
    location ~* \.(?:webmanifest|json)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # Media, icons, and fonts
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny access to hidden files (except Let's Encrypt challenge)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
