services:
  # Development service: live coding with hot reload
  # Configurable port via PORT environment variable (defaults to 3000)
  # Examples:
  #   docker compose up dev
  #   PORT=4000 docker compose up dev
  dev:
    build:
      context: .
      target: dev
      args:
        PORT: ${PORT:-3000}
    container_name: khatt-dev
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true

  # Build service: compiles static export into host's ./out directory
  # Usage: docker compose run --rm build
  build:
    build:
      context: .
      target: builder
    container_name: khatt-build
    volumes:
      - ./out:/export
